# Duck Detector 中文覆盖表（仅 fork 自用）
#
# key   = 源码里的英文原文。插值位置按出现顺序写成 {0}、{1}；变量改名不影响匹配。
# value = 中文译文。源码里有几个插值，译文就必须用几个占位符（顺序可调，不能删）。
#
# 只覆盖「界面上看得见的文案」：导出报告的行、日志、许可证原文、异常消息保持英文。
# 改完跑 `python3 scripts/ci-zh-extract.py .` 看漏翻（missing）与失效（stale）。

