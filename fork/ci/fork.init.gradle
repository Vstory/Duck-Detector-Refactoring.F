// fork 的构建参数：包名与版本号。用 `-I fork/ci/fork.init.gradle` 引入，
// 上游的 build.gradle.kts / build-logic 一行不改，同步上游时不会冲突。
//
// 改写点在插件应用之后、AGP 创建 variant 之前（withPlugin 回调 + defaultConfig）。
// 不走 androidComponents.beforeVariants：AGP 9 移除了 ApplicationVariantBuilder.applicationId，
// 设它会报 "unknown property"。defaultConfig 是上游构建文件自己用的那个 DSL，始终有效。
def forkApplicationId = System.getenv("CI_APPLICATION_ID") ?: "com.eltavine.duckdetector.fork"
def forkVersionName = System.getenv("CI_VERSION_NAME") ?: "1.0.0"
def forkVersionCode = (System.getenv("CI_VERSION_CODE") ?: "5000") as Integer

gradle.beforeProject { project ->
    project.pluginManager.withPlugin("com.android.application") {
        def android = project.extensions.getByName("android")
        def defaultConfig = android.defaultConfig
        defaultConfig.applicationId = forkApplicationId
        defaultConfig.versionName = forkVersionName
        defaultConfig.versionCode = forkVersionCode
    }
}
